name: stwo-cairo-verifier CI

on:
  workflow_call:
  workflow_dispatch:

jobs:
  scarb-fmt:
    runs-on: ${{ vars.RUNNER_MEDIUM || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: stwo_cairo_verifier
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1
        with:
          tool-versions: .tool-versions
      - run: scarb fmt --check

  scarb-lint:
    runs-on: ${{ vars.RUNNER_MEDIUM || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: stwo_cairo_verifier
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1
        with:
          tool-versions: .tool-versions
      - run: scarb lint --features=qm31_opcode --deny-warnings

  scarb-test:
    runs-on: ${{ vars.RUNNER_SMALL || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: stwo_cairo_verifier
    strategy:
      matrix:
        feature: [poseidon252_verifier, qm31_opcode]
        package:
          - stwo_verifier_core
          - stwo_verifier_utils
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1
        with:
          tool-versions: .tool-versions
      - run: scarb test --features=${{ matrix.feature }} -p ${{ matrix.package }}

  scarb-test-circuit:
    runs-on: ${{ vars.RUNNER_MEDIUM || 'ubuntu-24.04' }}
    defaults:
      run:
        working-directory: stwo_cairo_verifier
    strategy:
      matrix:
        feature: [poseidon252_verifier, qm31_opcode]
        package:
          - stwo_circuit_air
          - stwo_circuit_verifier
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: software-mansion/setup-scarb@2a96b748888e3329ee44ac9ac073d930e692b3cd # v1
        with:
          tool-versions: .tool-versions
      - run: scarb test --features=${{ matrix.feature }} -p ${{ matrix.package }}
